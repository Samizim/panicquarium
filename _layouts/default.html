<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="Panicquarium! by Studiozim">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Lilita+One&display=swap">
<style>
:root{--sea:#0b3d5c;--sea-2:#11618a;--bg:#eef8f7;--surface:#fff;--ink:#0f2a3a;--muted:#4b6675;--line:#cfe3e4;--orange:#ff8a1f;--sand:#f7dd9c}
@media (prefers-color-scheme:dark){:root{--bg:#07192a;--surface:#0e2a3f;--ink:#e5f3f6;--muted:#9db7c4;--line:#1d4058}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Figtree","Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(180deg,var(--sea) 0%,var(--sea-2) 100%);padding:28px 16px 64px;text-align:center;position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:48px;background:var(--bg);clip-path:ellipse(70% 100% at 50% 100%)}
header img{width:min(360px,80vw);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.bubbles span{position:absolute;bottom:-20px;border-radius:50%;background:rgba(255,255,255,.18);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-320px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}}
main{max-width:820px;margin:-28px auto 0;padding:0 16px 48px;position:relative;z-index:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px clamp(18px,4vw,44px);box-shadow:0 10px 30px rgba(11,61,92,.10)}
h1,h2{font-family:"Lilita One","Arial Rounded MT Bold",sans-serif;font-weight:400;line-height:1.15;letter-spacing:.01em}
h1{font-size:clamp(28px,5vw,40px);margin:0 0 6px;color:var(--sea-2)}
@media (prefers-color-scheme:dark){h1{color:var(--sand)}}
h2{font-size:24px;margin:30px 0 8px;color:var(--orange)}
p,li{color:var(--ink)}
em{color:var(--muted)}
ul{padding-left:22px}li{margin:4px 0}
a{color:var(--sea-2);font-weight:600}
@media (prefers-color-scheme:dark){a{color:#6cc8f0}}
code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:.9em}
footer{text-align:center;color:var(--muted);font-size:15px;padding:0 16px 40px}
footer a{color:inherit}
.lead{font-size:20px;margin:4px 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.btn{display:inline-block;padding:10px 18px;border-radius:999px;background:var(--orange);color:#fff;font-weight:700;text-decoration:none;font-size:16px}
.btn.soon{background:var(--line);color:var(--muted)}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:18px 0}
.gallery img{width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
.links{margin-top:26px;text-align:center}
main.wide{max-width:1240px}
main.wide .card{padding:36px clamp(18px,4vw,56px)}
main.wide h1{font-size:clamp(30px,4.4vw,52px)}
main.wide .lead{font-size:clamp(18px,1.8vw,24px)}
main.wide .gallery{grid-template-columns:repeat(2,1fr);gap:14px}
@media (max-width:640px){main.wide .gallery{grid-template-columns:1fr}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.cols>div{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px 20px}
.cols h3{font-family:"Lilita One",sans-serif;font-weight:400;font-size:22px;margin:0 0 6px;color:var(--sea-2)}
@media (prefers-color-scheme:dark){.cols h3{color:var(--sand)}}
.cols p{margin:0}

.ver{margin:-4px 0 6px;color:var(--muted);font-size:15px}
.langs{text-align:right;margin:0;font-size:15px}
h2.older{color:var(--muted);font-size:20px;margin-top:40px;border-top:1px solid var(--line);padding-top:24px}
details{margin:2px 0 10px}summary{cursor:pointer;color:var(--sea-2);font-weight:600}
@media (prefers-color-scheme:dark){summary{color:#6cc8f0}}
</style>
</head>
<body id="top">
<header>
  <div class="bubbles" aria-hidden="true"><span style="left:8%;width:14px;height:14px;animation-duration:9s"></span><span style="left:22%;width:8px;height:8px;animation-duration:7s;animation-delay:2s"></span><span style="left:78%;width:12px;height:12px;animation-duration:10s;animation-delay:1s"></span><span style="left:90%;width:7px;height:7px;animation-duration:8s;animation-delay:3s"></span></div>
  <a href="/"><img src="/assets/logo.png" alt="Panicquarium!"></a>
</header>
<main{% if page.wide %} class="wide"{% endif %}><article class="card">
{{ content }}
</article></main>
<footer>Panicquarium! is made by <a href="https://studiozim.com.br">Studiozim</a> · <a href="/news/">What's new</a> · <a href="/novidades/">Novidades</a> · <a href="/privacy/">Privacy</a> · <a href="mailto:suporte@studiozim.com.br">suporte@studiozim.com.br</a></footer>
</body>
</html>
