<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="Panicquarium! by Studiozim">
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Lilita+One&display=swap">
<style>
:root{--sea:#0b3d5c;--sea-2:#11618a;--bg:#eef8f7;--surface:#fff;--ink:#0f2a3a;--muted:#4b6675;--line:#cfe3e4;--orange:#ff8a1f;--sand:#f7dd9c}
@media (prefers-color-scheme:dark){:root{--bg:#07192a;--surface:#0e2a3f;--ink:#e5f3f6;--muted:#9db7c4;--line:#1d4058}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Figtree","Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(180deg,var(--sea) 0%,var(--sea-2) 100%);padding:28px 16px 64px;text-align:center;position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:48px;background:var(--bg);clip-path:ellipse(70% 100% at 50% 100%)}
header img{width:min(360px,80vw);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.bubbles span{position:absolute;bottom:-20px;border-radius:50%;background:rgba(255,255,255,.18);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-320px);opacity:0}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}}
main{max-width:820px;margin:-28px auto 0;padding:0 16px 48px;position:relative;z-index:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px clamp(18px,4vw,44px);box-shadow:0 10px 30px rgba(11,61,92,.10)}
h1,h2{font-family:"Lilita One","Arial Rounded MT Bold",sans-serif;font-weight:400;line-height:1.15;letter-spacing:.01em}
h1{font-size:clamp(28px,5vw,40px);margin:0 0 6px;color:var(--sea-2)}
@media (prefers-color-scheme:dark){h1{color:var(--sand)}}
h2{font-size:24px;margin:30px 0 8px;color:var(--orange)}
p,li{color:var(--ink)}
em{color:var(--muted)}
ul{padding-left:22px}li{margin:4px 0}
a{color:var(--sea-2);font-weight:600}
@media (prefers-color-scheme:dark){a{color:#6cc8f0}}
code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:.9em}
footer{text-align:center;color:var(--muted);font-size:15px;padding:0 16px 40px}
footer a{color:inherit}
</style>
</head>
<body>
<header>
  <div class="bubbles" aria-hidden="true"><span style="left:8%;width:14px;height:14px;animation-duration:9s"></span><span style="left:22%;width:8px;height:8px;animation-duration:7s;animation-delay:2s"></span><span style="left:78%;width:12px;height:12px;animation-duration:10s;animation-delay:1s"></span><span style="left:90%;width:7px;height:7px;animation-duration:8s;animation-delay:3s"></span></div>
  <a href="https://studiozim.com.br/#panicquarium"><img src="/assets/logo.png" alt="Panicquarium!"></a>
</header>
<main><article class="card">
{{ content }}
</article></main>
<footer>Panicquarium! is made by <a href="https://studiozim.com.br">Studiozim</a> · <a href="mailto:suporte@studiozim.com.br">suporte@studiozim.com.br</a></footer>
</body>
</html>
